name: Open EPG Güncelle

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Open EPG oluştur
        run: |
          python open_epg.py

      - name: EPG kontrolü
        run: |
          echo "EPG dosyası:"
          ls -lh epg.xml

          echo "Kanal sayısı:"
          grep -c "<channel " epg.xml || true

          echo "Program sayısı:"
          grep -c "<programme " epg.xml || true

      - name: Değişiklikleri GitHub'a gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add epg.xml

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Open EPG güncellendi"
            git push
          fi
